name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Worker tests
        working-directory: worker
        run: node --experimental-strip-types --test test/*.test.ts
      - name: Ses varlıkları tam mı
        run: dart run tools/gen_sounds.dart --check

  android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
      - run: flutter pub get
      # PB-032: key.properties YOK → release debug anahtarıyla imzalanır
      # (CI artifact'i üretilebilir; mağaza teslimi gerçek anahtar ister).
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: appbundle
          path: build/app/outputs/bundle/release/app-release.aab

  # PB-032: imzalı mağaza artifact'i. Depo sırları (ANDROID_KEYSTORE_BASE64 vb.)
  # tanımlandığında otomatik imzalı AAB üretir.
  android-signed:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
      - run: flutter pub get
      - name: Keystore'u kur
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: appbundle-signed
          path: build/app/outputs/bundle/release/app-release.aab

  # iOS arşivi macOS runner gerektirir; imzalama sırları eklenince açılır.
